# This is a basic workflow to help you get started with Actions

name: A workflow for my Hello Worls File

# Controls when the workflow will run
on: push                               # on: attribute. This is a trigger to specify when this workflow will run

jobs:
  
  build:                               # This workflow contains a single job called "build"
    name: Hello world action           # Name of the runner
    runs-on: ubuntu-latest             # The type of runner that the job will run on
    
    steps:                             # Steps represent a sequence of tasks that will be executed as part of the job
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v1
      - uses: ./action-a
        with:
          MY_NAME: "CAIO"
